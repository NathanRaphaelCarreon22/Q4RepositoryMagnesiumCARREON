<!DOCTYPE html>
<html>
<head>
<title>Movie CRUD Exercise</title>

<style>

/* ----------- CSS Implementation (Rubric #2) ----------- */
.movie button{
    background:red;
    color:white;
    border:none;
    padding:6px 10px;
    border-radius:5px;
    cursor:pointer;
}

body{
    font-family: Arial;
    background:#f2f2f2;
}

.container{
    width:420px;
    margin:auto;
    margin-top:40px;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0px 0px 5px gray;
}

input, select{
    width:100%;
    padding:8px;
    margin-top:5px;
    margin-bottom:15px;
}

button{
    width:100%;
    padding:10px;
    background:#1e88ff;
    color:white;
    border:none;
    border-radius:5px;
    font-size:16px;
}

.star{
    font-size:24px;
    cursor:pointer;
    color:gray;
}

.selected{
    color:gold;
}

.movie{
    background:#eee;
    padding:10px;
    border-radius:6px;
    margin-top:10px;
}

</style>
</head>

<body>

<div class="container">

<h2>Add a Movie</h2>

<!-- Movie Title -->
<label>Title:</label>
<input id="title">

<!-- Movie Year -->
<label>Year:</label>
<input id="year">

<!-- Genre Selection -->
<label>Genre:</label>
<select id="genre">
<option>Action</option>
<option>Comedy</option>
<option>Drama</option>
<option>Horror</option>
<option>Sci-Fi</option>
</select>

<!-- Star Rating -->
<label>Rating:</label>
<div id="starContainer">

<span class="star" onclick="selectRating(1)">★</span>
<span class="star" onclick="selectRating(2)">★</span>
<span class="star" onclick="selectRating(3)">★</span>
<span class="star" onclick="selectRating(4)">★</span>
<span class="star" onclick="selectRating(5)">★</span>

</div>

<br>

<button onclick="addMovie()">Add Movie</button>

<h3>Movie List</h3>

<div id="movieList"></div>

</div>


<script>

/* ----------- Global Variable ----------- */

let selectedRating = 0;


/* ----------- Star Rating Selection ----------- */
/* Changes stars to yellow when clicked */

function selectRating(rating){

selectedRating = rating;

let stars = document.querySelectorAll(".star");

stars.forEach((star,index)=>{

star.classList.remove("selected");

if(index < rating){
star.classList.add("selected");
}

});

}


/* ----------- Add Movie ----------- */

function addMovie(){

let title = document.getElementById("title").value;
let year = document.getElementById("year").value;
let genre = document.getElementById("genre").value;

/* JS Object */

let movie = {
title:title,
year:year,
genre:genre,
rating:selectedRating
};

/* Get existing movies */

let movies = JSON.parse(localStorage.getItem("movies")) || [];

/* Add new movie */

movies.push(movie);

/* Save back to localStorage */

localStorage.setItem("movies", JSON.stringify(movies));

displayMovies();

}


/* ----------- Delete Movie ----------- */

function deleteMovie(index){

let movies = JSON.parse(localStorage.getItem("movies")) || [];

movies.splice(index,1); // remove movie

localStorage.setItem("movies", JSON.stringify(movies));

displayMovies();

}


/* ----------- Display Movies ----------- */

function displayMovies(){

let movieList = document.getElementById("movieList");

movieList.innerHTML="";

let movies = JSON.parse(localStorage.getItem("movies")) || [];

movies.forEach((movie,index)=>{

let stars = "★".repeat(movie.rating);

movieList.innerHTML += `
<div class="movie">
${movie.title} (${movie.year}) - ${movie.genre}, 
Rating: <span style="color:gold">${stars}</span>

<br><br>

<button onclick="deleteMovie(${index})" style="background:red;">
Delete
</button>

</div>
`;

});

}

/* Load movies when page starts */

displayMovies();

</script>

</body>
</html>
